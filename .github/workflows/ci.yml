name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sniper
          POSTGRES_PASSWORD: sniper
          POSTGRES_DB: sniper_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sniper" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sniper:sniper@localhost:5432/sniper_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
