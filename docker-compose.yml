# Local / single-host deployment. Paper mode only unless a live adapter is
# configured and explicitly authorized at runtime (see docs/security.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sniper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sniper}
      POSTGRES_DB: sniper
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sniper -d sniper']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  server:
    build: { context: ., dockerfile: docker/server.Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://sniper:${POSTGRES_PASSWORD:-sniper}@postgres:5432/sniper
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ['127.0.0.1:4000:4000']
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://server:4000
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
    depends_on: [server]
    ports: ['127.0.0.1:3000:3000']
    restart: unless-stopped

volumes:
  pgdata:
